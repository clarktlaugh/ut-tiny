[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Until the game menu exists (P24), the site root goes to the demo hub.
# Forced, because a file (index.html) exists at "/".
[[redirects]]
  from = "/"
  to = "/demos/"
  status = 302
  force = true

# SPA fallback for unknown paths. Not forced, so real pages (the hub, every
# demos/<slug>.html, version.json) are served as files.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.wasm"
  [headers.values]
    Content-Type = "application/wasm"

[[headers]]
  for = "/*.ktx2"
  [headers.values]
    Content-Type = "image/ktx2"

[[headers]]
  for = "/*.glb"
  [headers.values]
    Content-Type = "model/gltf-binary"

[[headers]]
  for = "/version.json"
  [headers.values]
    Cache-Control = "no-cache"
