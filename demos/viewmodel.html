<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="data:," />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <title>View model · ut-tiny demos</title>
    <style>
      /* View model demo, one dark look: full-screen canvas with a HUD and a control strip. */
      :root {
        --ink: #e4e6ea;
        --dim: #9aa1ab;
        --panel: rgb(14 17 21 / 72%);
        --chip: rgb(255 255 255 / 9%);
        --chip-on: #d9a441;
        --chip-on-ink: #17130a;
        --ground: #101418;
        --mono: ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
        color-scheme: dark;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: var(--ground);
        color: var(--ink);
        font: 12px/1.4 var(--mono);
        overscroll-behavior: none;
      }
      canvas {
        display: block;
        width: 100vw;
        height: 100vh;
        touch-action: none;
      }
      #hud {
        position: fixed;
        top: calc(8px + env(safe-area-inset-top, 0px));
        left: calc(8px + env(safe-area-inset-left, 0px));
        right: calc(8px + env(safe-area-inset-right, 0px));
        width: fit-content;
        max-width: calc(100vw - 16px);
        background: var(--panel);
        padding: 6px 8px;
        border-radius: 4px;
        pointer-events: none;
        white-space: pre-wrap;
      }
      .vm-bar {
        position: fixed;
        left: 0;
        right: 0;
        display: flex;
        flex-direction: column;
        gap: 6px;
        padding-left: max(8px, env(safe-area-inset-left, 0px));
        padding-right: max(8px, env(safe-area-inset-right, 0px));
        pointer-events: none;
      }
      .vm-top {
        bottom: calc(8px + env(safe-area-inset-bottom, 0px));
      }
      .touch .vm-top {
        top: calc(78px + env(safe-area-inset-top, 0px));
        bottom: auto;
      }
      .vm-row {
        display: flex;
        gap: 6px;
        align-items: center;
        overflow-x: auto;
        scrollbar-width: none;
        pointer-events: auto;
        width: fit-content;
        max-width: 100%;
        padding: 4px;
        border-radius: 6px;
        background: var(--panel);
      }
      .vm-label {
        color: var(--dim);
        text-transform: uppercase;
        letter-spacing: 0.08em;
        font-size: 10px;
        padding: 0 4px;
        white-space: nowrap;
      }
      .vm-chip {
        flex: none;
        font: inherit;
        color: var(--ink);
        background: var(--chip);
        border: 0;
        border-radius: 4px;
        padding: 6px 9px;
        white-space: nowrap;
        cursor: pointer;
        touch-action: manipulation;
      }
      .vm-chip.on {
        background: var(--chip-on);
        color: var(--chip-on-ink);
      }
      .vm-chip:focus-visible {
        outline: 2px solid var(--chip-on);
        outline-offset: 1px;
      }
      .vm-pad {
        bottom: calc(16px + env(safe-area-inset-bottom, 0px));
        right: max(16px, env(safe-area-inset-right, 0px));
        left: auto;
        display: grid;
        grid-template-columns: repeat(2, auto);
        gap: 10px;
        padding: 0;
      }
      .vm-btn {
        pointer-events: auto;
        min-width: 64px;
        min-height: 52px;
        border-radius: 26px;
        font-size: 13px;
        background: var(--panel);
        border: 1px solid rgb(255 255 255 / 18%);
        user-select: none;
        -webkit-user-select: none;
      }
      .vm-fire {
        min-height: 72px;
        grid-row: span 2;
        border-color: var(--chip-on);
      }
      .vm-stick {
        position: fixed;
        width: 112px;
        height: 112px;
        margin: -56px 0 0 -56px;
        border-radius: 50%;
        border: 1px solid rgb(255 255 255 / 25%);
        background: rgb(255 255 255 / 6%);
        pointer-events: none;
      }
      .vm-knob {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 48px;
        height: 48px;
        border-radius: 50%;
        background: rgb(255 255 255 / 30%);
        transform: translate(-50%, -50%);
      }
    </style>
  </head>
  <body>
    <canvas id="scene"></canvas>
    <div id="hud"></div>
    <script type="module" src="/src/demos/viewmodel/main.ts"></script>
  </body>
</html>
