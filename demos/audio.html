<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="data:," />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Sound board · ut-tiny demos</title>
    <style>
      body {
        margin: 0;
        padding: 64px max(16px, env(safe-area-inset-right, 0px)) 24px
          max(16px, env(safe-area-inset-left, 0px));
        background: #101418;
        color: #dde;
        font:
          13px/1.4 system-ui,
          sans-serif;
      }
      h2 {
        font-size: 14px;
        margin: 16px 0 6px;
      }
      #sounds {
        display: flex;
        flex-wrap: wrap;
        gap: 4px;
      }
      button:not(.ds-btn) {
        min-height: 36px;
        background: #223;
        color: #dde;
        border: 1px solid #446;
        padding: 6px 10px;
        border-radius: 3px;
        touch-action: manipulation;
        cursor: pointer;
      }
      label {
        display: inline-block;
        margin: 0 12px 6px 0;
      }
      #status {
        font-family: monospace;
      }
    </style>
  </head>
  <body>
    <div id="status">Tap or click anywhere to start audio.</div>
    <h2>Where</h2>
    <label><input type="radio" name="where" value="local" checked /> local (non-positional)</label>
    <label><input type="radio" name="where" value="world" /> world at distance</label>
    <label>distance <input id="distance" type="range" min="1" max="120" value="20" /></label>
    <label>angle <input id="angle" type="range" min="-180" max="180" value="45" /></label>
    <h2>Volume</h2>
    <div id="volume"></div>
    <h2>Scenarios</h2>
    <button id="firefight">Simulated firefight (event stream)</button>
    <button id="announcer">Announcer lines</button>
    <h2>Sounds</h2>
    <div id="sounds"></div>
    <script type="module" src="/src/demos/audio/main.ts"></script>
  </body>
</html>
